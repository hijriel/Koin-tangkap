
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tangkap Koin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>🪙 Tangkap Koin</h1>

        <div class="info">
            <span>Skor: <b id="score">0</b></span>
            <span>Nyawa: <b id="lives">❤️❤️❤️</b></span>
        </div>

        <canvas id="gameCanvas" width="360" height="500"></canvas>

        <p id="message">Tangkap koin, hindari bom!</p>

        <button id="startBtn">▶ Mulai Game</button>

        <div class="controls">
            <button id="leftBtn">⬅️</button>
            <button id="rightBtn">➡️</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
